<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在连接 — 外贸智慧协同</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(6, 182, 212, 0.22), transparent 55%),
        linear-gradient(160deg, #070b14 0%, #0b1220 45%, #101a2e 100%);
      color: #e2e8f0;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .spin {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(6, 182, 212, 0.25);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: rot 0.8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 18px; font-weight: 800; }
    p { margin: 0; max-width: 420px; line-height: 1.55; font-size: 13px; color: #94a3b8; }
    .code { font-size: 11px; color: #64748b; word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" aria-hidden="true"></div>
    <h1>正在打开登录界面…</h1>
    <p>客户端正在连接线上服务，弱网时可能需要 30～60 秒，请稍候。</p>
    <p class="code" id="origin">https://babyworld.ltd</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search || '');
      var origin = params.get('origin') || 'https://babyworld.ltd';
      var el = document.getElementById('origin');
      if (el) el.textContent = origin;
      var n = Number(params.get('attempt') || '1');
      if (n > 1) {
        document.querySelector('h1').textContent = '第 ' + n + ' 次连接…';
      }
    })();
  </script>
</body>
</html>
