    <!-- 字体异步加载：禁止同步拉 Google Fonts，国内网络下会整页白屏卡死 -->
    <script>
      (function () {
        try {
          var href =
            'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap';
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.media = 'print';
          link.onload = function () {
            link.media = 'all';
          };
          link.onerror = function () {
            /* 忽略：继续用系统中文字体 */
          };
          document.head.appendChild(link);
          window.setTimeout(function () {
            if (link.media === 'print') link.media = 'all';
          }, 2500);
        } catch (e) {}
      })();
    </script>
    
    <script>
        // Fix for "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
        (function() {
            try {
                var target = window;
                var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
                if (!desc && window.constructor && window.constructor.prototype) {
                    target = window.constructor.prototype;
                    desc = Object.getOwnPropertyDescriptor(target, 'fetch');
                }
                if (desc && desc.configurable) {
                    var originalFetch = window.fetch;
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return originalFetch; },
                        set: function(v) { originalFetch = v; },
                        configurable: true,
                        enumerable: true
                    });
                } else if (!desc) {
                    var _fetch = window.fetch;
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return _fetch; },
                        set: function(v) { _fetch = v; },
                        configurable: true,
                        enumerable: true
                    });
                }
            } catch (e) {}
        })();

        /**
         * 发版后旧 HTML 若仍指向已删除的 /assets/index-*.js → 整页白屏。
         * 脚本加载失败时自动清缓存参数并重载一次；仍失败则给出可见提示。
         */
        window.__TP_BOOT_FAIL = function (reason) {
            try {
                var key = 'tp_boot_reload_v1';
                var n = parseInt(sessionStorage.getItem(key) || '0', 10) || 0;
                if (n < 1) {
                    sessionStorage.setItem(key, String(n + 1));
                    var u = new URL(location.href);
                    u.searchParams.set('_boot', String(Date.now()));
                    location.replace(u.toString());
                    return;
                }
            } catch (e) {}
            var el = document.getElementById('root');
            if (!el) return;
            el.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:system-ui,sans-serif;background:#070b14;color:#e2e8f0;text-align:center">' +
                '<div style="font-size:18px;font-weight:800">页面资源未加载成功</div>' +
                '<div style="font-size:13px;color:#94a3b8;max-width:360px;line-height:1.5">多半是网络超时或发版缓存未刷新。请检查能否打开本站，关闭客户端后重开，或按 Ctrl+Shift+R（Mac：Cmd+Shift+R）强制刷新。</div>' +
                '<button type="button" onclick="location.href=location.pathname+\'?_boot=\'+Date.now()+location.hash" ' +
                'style="margin-top:8px;padding:10px 18px;border:0;border-radius:12px;background:#06b6d4;color:#042f2e;font-weight:700;cursor:pointer">立即重试</button>' +
                '<div style="font-size:11px;color:#64748b">原因: ' +
                String(reason || 'unknown') +
                '</div></div>';
        };
        window.addEventListener(
            'error',
            function (e) {
                var t = e && e.target;
                if (t && t.tagName === 'SCRIPT' && t.src && /\/assets\//.test(t.src)) {
                    window.__TP_BOOT_FAIL('script-404');
                }
            },
            true
        );
        // 主包一执行会调用 __TP_BOOT_MARK 取消计时。禁止改写启动壳文案（避免「正在加载登录界面」闪屏）。
        window.__TP_BOOT_MARK = function () {
            try {
                if (window.__TP_BOOT_TIMER) {
                    clearTimeout(window.__TP_BOOT_TIMER);
                    window.__TP_BOOT_TIMER = null;
                }
            } catch (e) {}
        };
        // 20s 仍停在启动壳 → 自动重试；8s 再露出重试（弱网下 3s 太容易误报）
        window.__TP_BOOT_TIMER = setTimeout(function () {
            if (document.getElementById('tp-boot')) {
                window.__TP_BOOT_FAIL('boot-timeout');
            }
        }, 20000);
        window.setTimeout(function () {
            try {
                var tip = document.getElementById('tp-boot-tip');
                var btn = document.getElementById('tp-boot-retry');
                if (document.getElementById('tp-boot') && tip) {
                    tip.textContent = '仍在加载登录界面，请稍候…';
                }
                if (document.getElementById('tp-boot') && btn) {
                    btn.style.display = 'inline-flex';
                }
            } catch (e) {}
        }, 8000);
    </script>

    <meta name="description" content="外贸智慧协同：赋能出海产业升级——选品适市、客户背调、开发触达与协同成交。">

    <!--
      样式由 Vite 打包进 /assets（无境外 CDN）。
      导出类库仍按需注入，避免与主包抢连接。
      window.__TP_ENSURE_EXPORT_LIBS() 供导出流程调用。
    -->
    <script>
      window.__TP_ENSURE_EXPORT_LIBS = function () {
        if (window.__TP_EXPORT_LIBS_PROMISE) return window.__TP_EXPORT_LIBS_PROMISE;
        var specs = [
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js' },
          { src: 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js' },
          {
            src: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
            onload: function () {
              if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              }
            },
          },
        ];
        window.__TP_EXPORT_LIBS_PROMISE = Promise.all(
          specs.map(function (s) {
            return new Promise(function (resolve) {
              if (document.querySelector('script[data-tp-export="' + s.src + '"]')) {
                resolve();
                return;
              }
              var el = document.createElement('script');
              el.src = s.src;
              el.async = true;
              el.dataset.tpExport = s.src;
              el.onload = function () {
                try {
                  if (s.onload) s.onload();
                } catch (e) {}
                resolve();
              };
              el.onerror = function () {
                resolve();
              };
              document.head.appendChild(el);
            });
          })
        );
        return window.__TP_EXPORT_LIBS_PROMISE;
      };
      // 不再自动预取境外导出库；等业务真正导出时再拉，避免挤占登录首屏带宽
    </script>

          color: rgba(241, 245, 249, 0.95);
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.14);
          backdrop-filter: blur(6px);
        }
        .tp-landing .tp-kpi-pill strong {
          color: #5eead4;
          font-variant-numeric: tabular-nums;
          font-size: 1.05em;
        }
        .tp-app main .bg-slate-50,
        .tp-app main .bg-slate-50\/50,
        .tp-app main .bg-slate-50\/80 {
          background: rgba(241, 246, 250, 0.96) !important;
        }
        .tp-app main .hover\:bg-slate-50:hover,
        .tp-app main .hover\:bg-slate-50\/50:hover {
          background: rgba(232, 242, 248, 0.98) !important;
        }
        .tp-app main .rounded-3xl,
        .tp-app main .rounded-2xl {
          border-radius: var(--tp-radius) !important;
        }
        .tp-app main h1,
        .tp-app main h2,
        .tp-app main h3 {
          letter-spacing: -0.038em;
          color: #0a1018;
          font-family: var(--tp-font);
        }
        .tp-app main h2.font-black,
        .tp-app main h3.font-black {
          font-weight: 800 !important;
        }
        .tp-app main p,
        .tp-app main li {
          line-height: 1.6;
        }
        .tp-app main label.text-slate-400,
        .tp-app main .text-xs.font-black.text-slate-400 {
          color: #475569 !important;
          letter-spacing: 0.08em;
          font-weight: 700 !important;
          font-size: 0.8125rem !important;
        }
        .tp-app main input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        .tp-app main textarea,
        .tp-app main select {
          background: rgba(255, 255, 255, 0.98) !important;
          border-color: rgba(15, 23, 42, 0.1) !important;
          transition: border-color 0.15s ease, box-shadow 0.15s ease;
          border-radius: 0.9rem;
          font-size: 1rem;
          line-height: 1.5;
        }
        .tp-app main input:not([type="checkbox"]):not([type="radio"]):focus,
        .tp-app main textarea:focus,
        .tp-app main select:focus {
          border-color: rgba(20, 184, 166, 0.52) !important;
          box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
          outline: none;
        }
        .tp-app main button.bg-slate-900,
        .tp-app main .bg-slate-900 {
          background: linear-gradient(135deg, #0a1018 0%, #0f766e 100%) !important;
          box-shadow:
            0 12px 28px -12px rgba(13, 148, 136, 0.5),
            0 1px 0 rgba(255,255,255,0.1) inset;
        }
        .tp-app main button.bg-slate-900:hover,
        .tp-app main .hover\:bg-blue-600:hover {
          filter: brightness(1.06);
        }

        .tp-panel-title {
          display: flex;
          align-items: center;
          gap: 0.85rem;
        }
        .tp-panel-title-icon {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 2.75rem;
          height: 2.75rem;
          border-radius: 0.9rem;
          background: linear-gradient(145deg, rgba(20,184,166,0.2), rgba(14,165,233,0.08));
          color: #0d9488;
          border: 1px solid rgba(20, 184, 166, 0.22);
          box-shadow: 0 0 18px -6px rgba(45, 212, 191, 0.45);
          flex-shrink: 0;
        }

        .tp-app main .bg-violet-600,
        .tp-app main .bg-purple-600 {
          background: linear-gradient(135deg, #0f766e, #14b8a6) !important;
        }
        .tp-app main .hover\:bg-violet-700:hover,
        .tp-app main .hover\:bg-purple-700:hover {
          filter: brightness(1.06);
        }
        .tp-app main .bg-emerald-600 {
          background: linear-gradient(135deg, #059669, #0d9488) !important;
        }
        .tp-app main .bg-blue-600:not(.tp-keep),
        .tp-app main .bg-cyan-600 {
          background: linear-gradient(135deg, #0d9488, #0e7490) !important;
        }
        .tp-app main .bg-cyan-50,
        .tp-app main .bg-sky-50 {
          background: rgba(240, 253, 250, 0.9) !important;
        }
        .tp-app main .text-cyan-700,
        .tp-app main .text-cyan-800,
        .tp-app main .text-cyan-900 {
          color: #0f766e !important;
        }
        .tp-app main .border-cyan-200,
        .tp-app main .border-cyan-100 {
          border-color: rgba(20, 184, 166, 0.28) !important;
        }

        /* 更快切入：模块切换几乎无感知延迟 */
        .animate-fade-in { animation: fadeIn 0.16s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }
        /* 登录首屏禁止依赖 opacity 动画 / both 填充：Electron 下易卡在 opacity:0 只剩深蓝底 */
        .tp-login-hero,
        .tp-login-card { animation: none !important; opacity: 1 !important; transform: none !important; }
        /* 保活面板切换：去掉进场动画，瞬时显示 */
        [data-module-pane][data-active="1"] .animate-fade-in {
          animation: none;
        }
        @keyframes tpPulse {
          0%, 100% { opacity: 0.55; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        .tp-live-dot {
          box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
          animation: tpPulse 2.2s ease-in-out infinite;
        }

        /* ——— 全模块满宽：侧栏 fixed + 主区 calc(100% - 侧栏宽) ——— */
        html, body, #root {
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          min-height: 100% !important;
          min-height: 100dvh !important;
        }
        #root {
          display: block !important;
        }
        .tp-app {
          --tp-sidebar-w: 4.25rem;
          position: relative !important;
          display: block !important;
          width: 100% !important;
          max-width: none !important;
          min-width: 100% !important;
          min-height: 100dvh !important;
          box-sizing: border-box !important;
        }
        .tp-app.is-nav-submenu { --tp-sidebar-w: 15.5rem; }
        .tp-app.is-nav-expanded:not(.is-nav-submenu) { --tp-sidebar-w: 4.5rem; }
        /* 左侧圆形按钮：固定贴边，菜单内部可滑 */
        .tp-sidebar.tp-sphere-rail {
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          bottom: 0 !important;
          width: var(--tp-sidebar-w) !important;
          height: 100dvh !important;
          overflow-x: hidden !important;
          overflow-y: auto !important;
          z-index: 9999 !important;
          pointer-events: auto !important;
          transform: none !important;
          box-sizing: border-box !important;
        }
        .tp-workspace {
          display: flex !important;
          flex-direction: column !important;
          margin-left: var(--tp-sidebar-w) !important;
          width: calc(100% - var(--tp-sidebar-w)) !important;
          max-width: none !important;
          min-width: 0 !important;
          min-height: 100dvh !important;
          overflow: visible !important;
          box-sizing: border-box !important;
        }
        @media (max-width: 767px) {
          .tp-workspace {
            margin-left: 0 !important;
            width: 100% !important;
          }
        }
        .tp-header,
        .tp-app main,
        .tp-app-main,
        .tp-main-stage {
          width: 100% !important;
          max-width: none !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
        }
        .tp-app main,
        .tp-app-main {
          flex: 1 1 auto !important;
        }
        .tp-main-stage .tp-module-pane.is-active,
        .tp-main-stage [data-module-pane][data-active="1"] {
          display: block !important;
          width: 100% !important;
          max-width: none !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
        }
        .tp-main-stage .tp-module-pane.is-active > *,
        .tp-main-stage [data-module-pane][data-active="1"] > * {
          width: 100% !important;
          max-width: none !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
          box-sizing: border-box !important;
        }
        .tp-main-stage .max-w-7xl,
        .tp-main-stage .max-w-6xl,
        .tp-main-stage .max-w-5xl,
        .tp-main-stage .max-w-\[96rem\],
        .tp-main-stage .max-w-\[90rem\],
        .tp-main-stage .max-w-\[80rem\],
        .tp-main-stage .max-w-screen-2xl,
        .tp-main-stage .max-w-screen-xl {
          max-width: none !important;
          width: 100% !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }

        /* 3D 工作台：左工具 | 中预览(吃剩余) | 右项目库，三栏随屏变宽 */
        .tp-3d-studio,
        .tp-landing {
          width: 100% !important;
          max-width: none !important;
          box-sizing: border-box !important;
        }
        .tp-3d-workbench {
          display: grid !important;
          grid-template-columns: 1fr;
          gap: 0.75rem;
          align-items: stretch;
          width: 100% !important;
          max-width: none !important;
          box-sizing: border-box !important;
        }
        @media (min-width: 1024px) {
          .tp-3d-workbench {
            /* 左固定工具 | 中预览吃剩余 | 右项目库随宽略增，三者合起来必须 100% */
            grid-template-columns: 280px minmax(0, 1fr) minmax(260px, 0.42fr) !important;
          }
        }
        @media (min-width: 1600px) {
          .tp-3d-workbench {
            grid-template-columns: 300px minmax(0, 1fr) minmax(300px, 0.38fr) !important;
          }
        }
        .tp-3d-workbench-stage {
          min-width: 0 !important;
          width: 100% !important;
          max-width: none !important;
        }
        .tp-3d-workbench-side,
        .tp-3d-workbench-library {
          min-width: 0 !important;
          width: 100% !important;
          max-width: none !important;
        }
        .tp-3d-workbench-library {
          max-height: none !important;
        }

        /* 平面设计等同理：≥1024 三栏铺满 */
        .tp-2d-studio {
          width: 100% !important;
          max-width: none !important;
        }
        .tp-2d-workbench {
          display: grid !important;
          grid-template-columns: 1fr;
          gap: 0.75rem;
          width: 100% !important;
          min-height: 36rem;
        }
        @media (min-width: 1024px) {
          .tp-2d-workbench {
            grid-template-columns: minmax(220px, 20%) minmax(0, 1fr) minmax(260px, 24%) !important;
          }
        }
        /* 平面画布缩略图：宽屏多列，单卡不要撑成半屏 */
        .tp-2d-canvas-grid {
          width: 100% !important;
        }
        .tp-2d-canvas-card {
          max-width: 16rem;
        }
        @media (min-width: 1280px) {
          .tp-2d-canvas-card {
            max-width: 14rem;
          }
        }

        /* ——— Sphere dock：窄轨固定 + 侧挂子菜单，主区 padding 让位 ——— */
        .tp-sphere-rail {
          overflow: hidden;
          flex-shrink: 0;
          transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tp-sphere-flyout {
          background: linear-gradient(180deg, rgba(12, 24, 44, 0.55), rgba(8, 16, 32, 0.35));
          border-left: 1px solid rgba(34, 211, 238, 0.16);
          box-shadow: -8px 0 28px -18px rgba(0, 0, 0, 0.5);
        }
        .tp-sphere-nav-hint {
          color: rgba(148, 163, 184, 0.85);
        }
        .tp-sphere-chrome {
          color: rgba(186, 230, 253, 0.85);
        }
        .tp-sphere-chrome:hover {
          color: #ecfeff;
          background: rgba(34, 211, 238, 0.12);
        }
        .tp-sphere-foot-btn {
          color: rgba(226, 232, 240, 0.8);
          border: 1px solid transparent;
        }
        .tp-sphere-foot-btn:hover {
          background: rgba(34, 211, 238, 0.12);
          border-color: rgba(34, 211, 238, 0.22);
        }
        .tp-sphere-foot-btn.is-on {
          background: rgba(34, 211, 238, 0.18);
          color: #ecfeff;
          border-color: rgba(34, 211, 238, 0.35);
          box-shadow: 0 0 16px -6px rgba(34, 211, 238, 0.7);
        }
        .tp-sphere {
          position: relative;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border: none;
          background: transparent;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }
        .tp-sphere-start {
          width: 3.35rem;
          height: 3.35rem;
        }
        .tp-sphere-core {
          position: relative;
          z-index: 2;
          width: 3.35rem;
          height: 3.35rem;
          border-radius: 999px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: #ecfeff;
          font-weight: 800;
          letter-spacing: 0.1em;
          background:
            radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 42%),
            radial-gradient(circle at 70% 78%, rgba(8,145,178,0.55), transparent 50%),
            linear-gradient(145deg, #22d3ee 0%, #0284c7 48%, #0e7490 100%);
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.35) inset,
            0 10px 22px -8px rgba(6,182,212,0.75),
            0 0 36px -2px rgba(34,211,238,0.65);
          transition: transform 0.25s ease, box-shadow 0.25s ease;
          animation: tpSphereBreath 3.2s ease-in-out infinite;
        }
        .tp-sphere-start:hover .tp-sphere-core {
          transform: scale(1.08) rotate(-8deg);
          animation: none;
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.45) inset,
            0 14px 32px -8px rgba(6,182,212,0.95),
            0 0 56px 0 rgba(34,211,238,0.75);
        }
        .tp-sphere-label {
          font-size: 0.78rem;
          text-shadow: 0 1px 8px rgba(8,47,73,0.45);
        }
        .tp-sphere-ring {
          position: absolute;
          inset: -5px;
          border-radius: 999px;
          border: 1px solid rgba(103, 232, 249, 0.45);
          animation: tpSphereSpin 7s linear infinite;
          pointer-events: none;
        }
        .tp-sphere-ring::before {
          content: '';
          position: absolute;
          width: 5px;
          height: 5px;
          border-radius: 999px;
          background: #67e8f9;
          top: 2px;
          left: 50%;
          box-shadow: 0 0 12px #67e8f9;
        }
        .tp-sphere-ring-delay {
          inset: -10px;
          border-color: rgba(14,165,233,0.28);
          animation-duration: 11s;
          animation-direction: reverse;
        }
        .tp-sphere-ring-sm {
          inset: -3px;
          animation-duration: 9s;
        }
        .tp-sphere-section {
          width: 3.45rem;
          height: 3.45rem;
          animation: tpSphereIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .tp-sphere-core-sm {
          width: 3.45rem;
          height: 3.45rem;
          background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), transparent 40%),
            linear-gradient(145deg, color-mix(in srgb, var(--sphere-accent, #22d3ee) 82%, white), color-mix(in srgb, var(--sphere-accent, #22d3ee) 40%, #020617));
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.35) inset,
            0 8px 18px -8px color-mix(in srgb, var(--sphere-accent, #22d3ee) 70%, transparent),
            0 0 24px -4px color-mix(in srgb, var(--sphere-accent, #22d3ee) 55%, transparent);
          color: #fff;
        }
        .tp-sphere-section.is-hot .tp-sphere-core-sm {
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.45) inset,
            0 0 0 2px color-mix(in srgb, var(--sphere-accent, #22d3ee) 55%, transparent),
            0 0 28px 0 color-mix(in srgb, var(--sphere-accent, #22d3ee) 70%, transparent);
        }
        .tp-sphere-label-sm {
          font-size: 0.68rem;
          letter-spacing: 0.1em;
          font-weight: 800;
        }
        .tp-sphere-orbit {
          min-height: 8rem;
        }
        .tp-sphere-orbit-ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 3.8rem;
          height: 12rem;
          transform: translate(-50%, -50%);
          border-radius: 999px;
          border: 1px dashed rgba(103, 232, 249, 0.22);
          animation: tpSphereOrbitSpin 18s linear infinite;
          pointer-events: none;
        }
        .tp-sphere-leaf {
          border: 1px solid rgba(148, 163, 184, 0.12);
          background: rgba(255, 255, 255, 0.06);
          color: #e2e8f0;
        }
        .tp-sphere-leaf:hover:not(:disabled) {
          background: rgba(34, 211, 238, 0.12);
          border-color: rgba(34, 211, 238, 0.35);
          box-shadow: 0 0 18px -10px rgba(34, 211, 238, 0.8);
        }
        .tp-sphere-leaf.is-active {
          background: linear-gradient(90deg, rgba(6,182,212,0.28), rgba(255,255,255,0.06));
          border-color: rgba(34, 211, 238, 0.45);
        }
        .tp-sphere-leaf .tp-leaf-title {
          color: #f1f5f9;
        }
        .tp-sphere-leaf .tp-leaf-sub {
          color: rgba(148, 163, 184, 0.9);
        }
        .tp-sphere-mini {
          width: 1.85rem;
          height: 1.85rem;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), transparent 45%),
            linear-gradient(145deg, color-mix(in srgb, var(--sphere-accent, #22d3ee) 85%, white), color-mix(in srgb, var(--sphere-accent, #22d3ee) 40%, #0f172a));
          box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 0 12px -2px rgba(34,211,238,0.5);
        }
        @keyframes tpSphereSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes tpSphereIn {
          from { opacity: 0; transform: scale(0.72) translateY(8px); }
          to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes tpSphereOrbitSpin {
          from { transform: translate(-50%, -50%) rotate(0deg); }
          to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes tpSphereBreath {
          0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.35) inset, 0 10px 22px -8px rgba(6,182,212,0.75), 0 0 28px -2px rgba(34,211,238,0.45); }
          50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.4) inset, 0 12px 26px -8px rgba(6,182,212,0.9), 0 0 42px 0 rgba(34,211,238,0.7); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: linear-gradient(180deg, rgba(20,184,166,0.4), rgba(100,116,139,0.28));
          border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(20, 184, 166, 0.55); }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .touch-manipulation { touch-action: manipulation; }

        /* Login atmosphere — 深空 + 青绿/暖金点缀，无 opacity 入场动画 */
        .tp-login {
          min-height: 100dvh;
          font-family: var(--tp-font);
          background:
            radial-gradient(920px 520px at 16% 6%, rgba(45, 212, 191, 0.28), transparent 55%),
            radial-gradient(760px 440px at 94% 78%, rgba(14, 165, 233, 0.14), transparent 52%),
            radial-gradient(560px 320px at 48% 100%, rgba(196, 165, 116, 0.14), transparent 58%),
            linear-gradient(158deg, #04070d 0%, #0a1018 40%, #0c1a22 100%);
          color: #e2e8f0;
        }
        .tp-login-card {
          background: #fcfdfe !important;
          border: 1px solid rgba(255, 255, 255, 0.6) !important;
          box-shadow:
            0 0 0 1px rgba(15, 23, 42, 0.04),
            0 28px 60px -28px rgba(0, 0, 0, 0.58),
            0 0 48px -10px rgba(45, 212, 191, 0.28) !important;
        }
        .tp-login-hero h1 {
          letter-spacing: -0.048em;
          font-weight: 800;
          font-size: clamp(2.15rem, 5.2vw, 3.35rem);
        }
        .tp-login .tp-login-cta {
          background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 45%, #0e7490 100%) !important;
          box-shadow:
            0 14px 30px -12px rgba(13, 148, 136, 0.78),
            0 1px 0 rgba(255,255,255,0.28) inset,
            0 0 28px -8px rgba(45, 212, 191, 0.45);
          font-size: 1.05rem;
        }
        .tp-sphere-leaf .tp-leaf-title {
          font-size: 0.9375rem;
          font-weight: 700;
        }
        .tp-sphere-leaf .tp-leaf-sub {
          font-size: 0.8125rem;
        }
    </style>

</head>
<body>
    <div id="root">
      <!-- 启动壳：直接画登录表单骨架，主 JS 未到也能先看见登录界面（字段暂不可用） -->
      <div id="tp-boot" class="tp-login" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif;">
        <div style="text-align:center;margin-bottom:2rem;">
          <div style="display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid rgba(94,234,212,0.35);background:rgba(45,212,191,0.12);color:#ccfbf1;font-size:13px;font-weight:700;letter-spacing:0.2em;margin-bottom:1.15rem;">智造出海</div>
          <div style="font-size:clamp(2.2rem,5.2vw,3.4rem);font-weight:800;color:#fff;letter-spacing:-0.048em;line-height:1.1;">外贸智慧协同</div>
          <div style="margin-top:0.85rem;font-size:1.15rem;color:rgba(203,213,225,0.9);font-weight:500;">赋能出海产业升级</div>
        </div>
        <div class="tp-login-card" style="width:100%;max-width:28rem;border-radius:1.35rem;padding:1.75rem 1.5rem;background:#fcfdfe;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;">
          <div style="font-size:13px;font-weight:700;color:#64748b;text-align:center" id="tp-boot-tip">登录界面加载中…</div>
          <input type="text" disabled placeholder="用户名" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#94a3b8;font-size:15px;font-weight:600;" />
          <input type="password" disabled placeholder="密码" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#94a3b8;font-size:15px;font-weight:600;" />
          <button type="button" disabled style="width:100%;padding:12px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,#2dd4bf,#0e7490);color:#fff;font-size:16px;font-weight:800;opacity:0.55;">登录</button>
          <button id="tp-boot-retry" type="button" onclick="location.href=location.pathname+'?_boot='+Date.now()+location.hash" style="display:none;margin:4px auto 0;padding:8px 16px;border:0;border-radius:10px;background:#0f172a;color:#e2e8f0;font-size:12px;font-weight:700;cursor:pointer;align-items:center;justify-content:center;">仍未就绪 · 点此重试</button>
        </div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
