    <script>
        // Fix for "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
        (function() {
            try {
                var target = window;
                var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
                if (!desc && window.constructor && window.constructor.prototype) {
                    target = window.constructor.prototype;
                    desc = Object.getOwnPropertyDescriptor(target, 'fetch');
                }
                if (desc && desc.configurable) {
                    var originalFetch = window.fetch;
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return originalFetch; },
                        set: function(v) { originalFetch = v; },
                        configurable: true,
                        enumerable: true
                    });
                } else if (!desc) {
                    var _fetch = window.fetch;
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return _fetch; },
                        set: function(v) { _fetch = v; },
                        configurable: true,
                        enumerable: true
                    });
                }
            } catch (e) {}
        })();

        /**
         * 发版后旧 HTML 若仍指向已删除的 /assets/index-*.js → 整页白屏。
         * 脚本加载失败时自动清缓存参数并重载一次；仍失败则给出可见提示。
         */
        window.__TP_BOOT_FAIL = function (reason) {
            try {
                var key = 'tp_boot_reload_v1';
                var n = parseInt(sessionStorage.getItem(key) || '0', 10) || 0;
                if (n < 1) {
                    sessionStorage.setItem(key, String(n + 1));
                    var u = new URL(location.href);
                    u.searchParams.set('_boot', String(Date.now()));
                    location.replace(u.toString());
                    return;
                }
            } catch (e) {}
            var el = document.getElementById('root');
            if (!el) return;
            el.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;text-align:center">' +
                '<div style="font-size:18px;font-weight:800">页面资源未加载成功</div>' +
                '<div style="font-size:13px;color:#64748b;max-width:360px;line-height:1.5">多半是发版缓存未刷新。请关闭客户端后重新打开，或按 Ctrl+Shift+R（Mac：Cmd+Shift+R）强制刷新。</div>' +
                '<button type="button" onclick="location.href=location.pathname+\'?_boot=\'+Date.now()+location.hash" ' +
                'style="margin-top:8px;padding:10px 18px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer">立即重试</button>' +
                '<div style="font-size:11px;color:#94a3b8">原因: ' +
                String(reason || 'unknown') +
                '</div></div>';
        };
        window.addEventListener(
            'error',
            function (e) {
                var t = e && e.target;
                if (t && t.tagName === 'SCRIPT' && t.src && /\/assets\//.test(t.src)) {
                    window.__TP_BOOT_FAIL('script-404');
                }
            },
            true
        );
        // 主包未执行才算启动失败。12s 对慢网/桌面种子过短会误杀；
        // 主包一执行会调用 __TP_BOOT_MARK 取消计时。
        window.__TP_BOOT_MARK = function (phase) {
            try {
                if (window.__TP_BOOT_TIMER) {
                    clearTimeout(window.__TP_BOOT_TIMER);
                    window.__TP_BOOT_TIMER = null;
                }
                var boot = document.getElementById('tp-boot');
                if (boot && phase) boot.textContent = String(phase);
            } catch (e) {}
        };
        window.__TP_BOOT_TIMER = setTimeout(function () {
            if (document.getElementById('tp-boot')) {
                window.__TP_BOOT_FAIL('boot-timeout');
            }
        }, 45000);
    </script>

    <!-- 第三方脚本必须 defer：同步加载若 CDN 超时会堵死解析，主包永不执行 → 一直「正在加载」 -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!--
      导出类 CDN 改为首屏后按需注入，避免与主包抢连接导致 boot-timeout / 客户端假死。
      window.__TP_ENSURE_EXPORT_LIBS() 供导出流程调用。
    -->
    <script>
      window.__TP_ENSURE_EXPORT_LIBS = function () {
        if (window.__TP_EXPORT_LIBS_PROMISE) return window.__TP_EXPORT_LIBS_PROMISE;
        var specs = [
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js' },
          { src: 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js' },
          { src: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js' },
          {
            src: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
            onload: function () {
              if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              }
            },
          },
        ];
        window.__TP_EXPORT_LIBS_PROMISE = Promise.all(
          specs.map(function (s) {
            return new Promise(function (resolve) {
              if (document.querySelector('script[data-tp-export="' + s.src + '"]')) {
                resolve();
                return;
              }
              var el = document.createElement('script');
              el.src = s.src;
              el.async = true;
              el.dataset.tpExport = s.src;
              el.onload = function () {
                try {
                  if (s.onload) s.onload();
                } catch (e) {}
                resolve();
              };
              el.onerror = function () {
                resolve();
              };
              document.head.appendChild(el);
            });
          })
        );
        return window.__TP_EXPORT_LIBS_PROMISE;
      };
      // 空闲时预取，不堵启动
      if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(function () {
          try {
            window.__TP_ENSURE_EXPORT_LIBS();
          } catch (e) {}
        }, { timeout: 8000 });
      } else {
        setTimeout(function () {
          try {
            window.__TP_ENSURE_EXPORT_LIBS();
          } catch (e) {}
        }, 4000);
      }
    </script>
    <style>
        :root {
          --tp-ink: #0b1220;
          --tp-ink-soft: #121a2b;
          --tp-signal: #06b6d4;
          --tp-signal-soft: rgba(6, 182, 212, 0.14);
          --tp-canvas: #e6eef5;
          /* Linear/Vercel 式：实心底 + 细边，避免全站毛玻璃拖慢滚动 */
          --tp-card: #ffffff;
          --tp-card-elevated: #ffffff;
          --tp-line: rgba(15, 23, 42, 0.08);
          --tp-text: #0f172a;
          --tp-muted: #64748b;
          --tp-shadow-panel: 0 0 0 1px rgba(15, 23, 42, 0.05), 0 1px 0 rgba(255,255,255,0.9) inset, 0 18px 40px -28px rgba(15, 23, 42, 0.28);
        }

        html, body, #root { min-height: 100%; min-height: 100dvh; }
        body {
          font-family: 'Sora', system-ui, sans-serif;
          background: var(--tp-canvas);
          color: var(--tp-text);
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
        }

        @media (prefers-reduced-motion: reduce) {
          .animate-fade-in,
          .tp-login-hero,
          .tp-login-card,
          .tp-sphere-core,
          .tp-sphere-ring,
          .tp-live-dot { animation: none !important; }
          .tp-btn-primary:hover:not(:disabled) { transform: none; }
        }

        /* ——— Unified world canvas：安静指挥台（参考 Linear / Vercel 克制氛围） ——— */
        .tp-app {
          position: relative;
          isolation: isolate;
          background:
            radial-gradient(1000px 480px at 0% 10%, rgba(6, 182, 212, 0.16), transparent 58%),
            radial-gradient(720px 360px at 100% 0%, rgba(14, 165, 233, 0.10), transparent 55%),
            radial-gradient(640px 320px at 70% 100%, rgba(8, 145, 178, 0.08), transparent 50%),
            linear-gradient(165deg, #eef4f9 0%, #e6eef5 48%, #dce7f0 100%);
        }
        .tp-app::before {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          z-index: 0;
          opacity: 0.32;
          background-image:
            linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
          background-size: 48px 48px;
          mask-image: radial-gradient(ellipse at 8% 20%, black 0%, transparent 70%);
        }
        /* 导航展开时：能量从左侧渗入整页底层，绝不盖住主区文字 */
        .tp-app::after {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          z-index: 0;
          opacity: 0;
          transition: opacity 0.45s ease;
          background:
            radial-gradient(720px 640px at 0% 42%, rgba(34, 211, 238, 0.18), transparent 62%),
            radial-gradient(520px 420px at 8% 18%, rgba(167, 139, 250, 0.10), transparent 55%);
        }
        .tp-app.is-nav-expanded::after { opacity: 1; }
        .tp-app > * { position: relative; z-index: 1; }

        /* Main stage：与侧栏同一画布，仅多一层轻雾让卡片浮起 */
        .tp-main-stage {
          background: transparent;
          content-visibility: auto;
        }
        .tp-main-stage::before {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          background:
            radial-gradient(720px 320px at 40% 0%, rgba(255,255,255,0.45), transparent 65%),
            radial-gradient(600px 280px at 70% 100%, rgba(6, 182, 212, 0.06), transparent 70%);
          z-index: 0;
        }
        .tp-main-stage > * { position: relative; z-index: 1; }

        /* ——— 导航坞：窄轨 + 深空玻璃，固定贴边跟随视口 ——— */
        .tp-sidebar {
          background:
            linear-gradient(
              180deg,
              rgba(7, 12, 24, 0.97) 0%,
              rgba(9, 18, 34, 0.96) 50%,
              rgba(6, 12, 24, 0.98) 100%
            ) !important;
          border-right: 1px solid rgba(34, 211, 238, 0.18) !important;
          box-shadow:
            1px 0 0 rgba(103, 232, 249, 0.06) inset,
            18px 0 40px -22px rgba(0, 0, 0, 0.5);
          /* 侧栏轻模糊即可；过重会拖累整页合成 */
          backdrop-filter: blur(12px) saturate(1.2);
          -webkit-backdrop-filter: blur(12px) saturate(1.2);
        }
        .tp-sidebar::before {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          opacity: 0.45;
          background-image:
            linear-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
          background-size: 18px 18px;
          mask-image: linear-gradient(180deg, black, transparent 88%);
        }
        .tp-sidebar .tp-brand-mark {
          background: linear-gradient(135deg, #22d3ee 0%, #0891b2 55%, #0e7490 100%);
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.28) inset,
            0 0 20px rgba(34, 211, 238, 0.55),
            0 8px 18px -8px rgba(6, 182, 212, 0.8);
        }
        .tp-nav-item {
          position: relative;
          color: rgba(226, 232, 240, 0.62) !important;
          border: 1px solid transparent;
        }
        .tp-nav-item:hover:not(:disabled) {
          color: #f8fafc !important;
          background: rgba(255, 255, 255, 0.04) !important;
          border-color: rgba(148, 163, 184, 0.08);
        }
        .tp-nav-item.is-active {
          color: #ecfeff !important;
          background: linear-gradient(90deg, rgba(6, 182, 212, 0.22), rgba(6, 182, 212, 0.06)) !important;
          border-color: rgba(6, 182, 212, 0.28) !important;
          box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.08) inset;
        }
        .tp-nav-item.is-active::before {
          content: '';
          position: absolute;
          left: 0;
          top: 20%;
          bottom: 20%;
          width: 3px;
          border-radius: 999px;
          background: linear-gradient(180deg, #67e8f9, #0891b2);
          box-shadow: 0 0 12px rgba(34, 211, 238, 0.55);
        }

        /* ——— Header / scan bar — 与玻璃导航坞同一材质 ——— */
        .tp-header {
          background: rgba(255, 255, 255, 0.82) !important;
          border-bottom: 1px solid rgba(15, 23, 42, 0.06) !important;
          backdrop-filter: blur(10px) saturate(1.1);
          box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.16);
        }
        .tp-scan-input {
          background: rgba(255, 255, 255, 0.92) !important;
          border: 1px solid rgba(15, 23, 42, 0.08) !important;
          box-shadow: 0 1px 0 rgba(255,255,255,0.85) inset, 0 8px 20px -16px rgba(15, 23, 42, 0.2) !important;
          letter-spacing: -0.01em;
          color: #020617 !important;
          -webkit-text-fill-color: #020617;
          font-weight: 600;
        }
        .tp-scan-input:focus {
          background: #fff !important;
          border-color: rgba(6, 182, 212, 0.55) !important;
          box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.14) !important;
          color: #020617 !important;
          -webkit-text-fill-color: #020617;
        }

        /* 所有输入控件：文字加深，避免看不清 */
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
        textarea,
        select {
          color: #020617 !important;
          -webkit-text-fill-color: #020617;
          caret-color: #0f172a;
        }
        input::placeholder,
        textarea::placeholder {
          color: #64748b !important;
          -webkit-text-fill-color: #64748b;
          opacity: 1;
        }
        input:disabled,
        textarea:disabled,
        select:disabled {
          color: #475569 !important;
          -webkit-text-fill-color: #475569;
          opacity: 1;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
          -webkit-text-fill-color: #020617 !important;
          transition: background-color 99999s ease-in-out 0s;
        }
        /* 玻璃侧栏输入：深色字 */
        .tp-sidebar input:not([type="checkbox"]):not([type="radio"]),
        .tp-sidebar textarea,
        .tp-sidebar select {
          color: #0f172a !important;
          -webkit-text-fill-color: #0f172a;
        }
        .tp-login input:not([type="checkbox"]):not([type="radio"]),
        .tp-login textarea,
        .tp-login select {
          color: #020617 !important;
          -webkit-text-fill-color: #020617;
        }
        .tp-btn-primary {
          background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%) !important;
          box-shadow: 0 10px 24px -10px rgba(6, 182, 212, 0.8), 0 1px 0 rgba(255,255,255,0.25) inset !important;
          letter-spacing: 0.02em;
          transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }
        .tp-btn-primary:hover:not(:disabled) {
          filter: brightness(1.05);
          transform: translateY(-1px);
        }
        .tp-btn-primary:disabled { filter: grayscale(0.2); transform: none; }

        /* ——— Elevate cards：实心面板（无 backdrop-filter，保模块滚动/切换流畅） ——— */
        .tp-app main .bg-white {
          background: var(--tp-card-elevated) !important;
          box-shadow: var(--tp-shadow-panel);
        }
        .tp-app main .border-slate-200,
        .tp-app main .border-slate-100 {
          border-color: var(--tp-line) !important;
        }
        /* 着陆页表面：投资人一眼能感到「产品级」层次 */
        .tp-landing .tp-surface {
          background: #fff;
          border: 1px solid var(--tp-line);
          box-shadow: var(--tp-shadow-panel);
          border-radius: 1.15rem;
        }
        .tp-landing .tp-hub-hero {
          position: relative;
          overflow: hidden;
          border-radius: 0.95rem;
          border: 1px solid rgba(34, 211, 238, 0.2);
          background:
            radial-gradient(ellipse 70% 140% at 100% 0%, rgba(34, 211, 238, 0.18), transparent 55%),
            linear-gradient(115deg, #05080f 0%, #0b1524 48%, #0c2a32 100%);
          box-shadow: 0 12px 28px -20px rgba(8, 24, 48, 0.5);
        }
        /* 小媛贴左侧「开始」球下方，不挡主区 */
        .tp-xiaoyuan-fab {
          pointer-events: auto;
        }
        .tp-app.is-nav-submenu .tp-xiaoyuan-fab {
          left: 0.35rem;
        }
        .tp-landing .tp-kpi {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        .tp-landing .tp-kpi-pill {
          display: inline-flex;
          align-items: center;
          gap: 0.35rem;
          padding: 0.35rem 0.7rem;
          border-radius: 999px;
          font-size: 10px;
          font-weight: 800;
          letter-spacing: 0.02em;
          color: rgba(226, 232, 240, 0.92);
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tp-landing .tp-kpi-pill strong {
          color: #67e8f9;
          font-variant-numeric: tabular-nums;
        }
        /* Soften dead grey wells → cool mist panels */
        .tp-app main .bg-slate-50,
        .tp-app main .bg-slate-50\/50,
        .tp-app main .bg-slate-50\/80 {
          background: rgba(241, 248, 252, 0.92) !important;
        }
        .tp-app main .hover\:bg-slate-50:hover,
        .tp-app main .hover\:bg-slate-50\/50:hover {
          background: rgba(236, 246, 251, 0.95) !important;
        }
        .tp-app main .rounded-3xl,
        .tp-app main .rounded-2xl {
          border-radius: 1.1rem !important;
        }
        .tp-app main h2.font-black,
        .tp-app main h3.font-black {
          letter-spacing: -0.03em;
          color: #0b1220;
        }
        .tp-app main label.text-slate-400,
        .tp-app main .text-xs.font-black.text-slate-400 {
          color: #64748b !important;
          letter-spacing: 0.08em;
        }
        /* Form controls: crisp, quiet focus */
        .tp-app main input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        .tp-app main textarea,
        .tp-app main select {
          background: rgba(255, 255, 255, 0.95) !important;
          border-color: rgba(15, 23, 42, 0.09) !important;
          transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .tp-app main input:not([type="checkbox"]):not([type="radio"]):focus,
        .tp-app main textarea:focus,
        .tp-app main select:focus {
          border-color: rgba(6, 182, 212, 0.5) !important;
          box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
          outline: none;
        }
        /* Primary dark CTAs → ink + cyan edge (less flat black) */
        .tp-app main button.bg-slate-900,
        .tp-app main .bg-slate-900 {
          background: linear-gradient(135deg, #0f172a 0%, #134e5e 100%) !important;
          box-shadow: 0 10px 24px -12px rgba(8, 145, 178, 0.45), 0 1px 0 rgba(255,255,255,0.08) inset;
        }
        .tp-app main button.bg-slate-900:hover,
        .tp-app main .hover\:bg-blue-600:hover {
          filter: brightness(1.06);
        }

        /* Module panel title strip */
        .tp-panel-title {
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        .tp-panel-title-icon {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 2.5rem;
          height: 2.5rem;
          border-radius: 0.85rem;
          background: linear-gradient(135deg, rgba(6,182,212,0.16), rgba(14,165,233,0.08));
          color: #0891b2;
          border: 1px solid rgba(6, 182, 212, 0.18);
          flex-shrink: 0;
        }

        /* Unify loud accent buttons into signal system */
        .tp-app main .bg-violet-600,
        .tp-app main .bg-purple-600 {
          background: linear-gradient(135deg, #0e7490, #0891b2) !important;
        }
        .tp-app main .hover\:bg-violet-700:hover,
        .tp-app main .hover\:bg-purple-700:hover {
          filter: brightness(1.06);
        }
        .tp-app main .bg-emerald-600 {
          background: linear-gradient(135deg, #059669, #0d9488) !important;
        }
        .tp-app main .bg-blue-600:not(.tp-keep) {
          background: linear-gradient(135deg, #0284c7, #0891b2) !important;
        }

        /* 更快切入：模块切换几乎无感知延迟 */
        .animate-fade-in { animation: fadeIn 0.16s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .tp-login-hero { animation: fadeIn 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
        .tp-login-card { animation: fadeIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both; }
        /* 保活面板切换：去掉进场动画，瞬时显示 */
        [data-module-pane][data-active="1"] .animate-fade-in {
          animation: none;
        }
        @keyframes tpPulse {
          0%, 100% { opacity: 0.55; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        .tp-live-dot {
          box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
          animation: tpPulse 2.2s ease-in-out infinite;
        }

        /* ——— Wider content stage (五板块改革) ——— */
        .tp-app main .max-w-7xl,
        .tp-app main .max-w-6xl {
          max-width: 90rem !important;
        }

        /* ——— Sphere dock：窄轨固定 + 侧挂子菜单，主区 padding 让位 ——— */
        .tp-sphere-rail {
          overflow: hidden;
          flex-shrink: 0;
          transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tp-sphere-flyout {
          background: linear-gradient(180deg, rgba(12, 24, 44, 0.55), rgba(8, 16, 32, 0.35));
          border-left: 1px solid rgba(34, 211, 238, 0.16);
          box-shadow: -8px 0 28px -18px rgba(0, 0, 0, 0.5);
        }
        .tp-sphere-nav-hint {
          color: rgba(148, 163, 184, 0.85);
        }
        .tp-sphere-chrome {
          color: rgba(186, 230, 253, 0.85);
        }
        .tp-sphere-chrome:hover {
          color: #ecfeff;
          background: rgba(34, 211, 238, 0.12);
        }
        .tp-sphere-foot-btn {
          color: rgba(226, 232, 240, 0.8);
          border: 1px solid transparent;
        }
        .tp-sphere-foot-btn:hover {
          background: rgba(34, 211, 238, 0.12);
          border-color: rgba(34, 211, 238, 0.22);
        }
        .tp-sphere-foot-btn.is-on {
          background: rgba(34, 211, 238, 0.18);
          color: #ecfeff;
          border-color: rgba(34, 211, 238, 0.35);
          box-shadow: 0 0 16px -6px rgba(34, 211, 238, 0.7);
        }
        .tp-sphere {
          position: relative;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border: none;
          background: transparent;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }
        .tp-sphere-start {
          width: 3.35rem;
          height: 3.35rem;
        }
        .tp-sphere-core {
          position: relative;
          z-index: 2;
          width: 3.35rem;
          height: 3.35rem;
          border-radius: 999px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: #ecfeff;
          font-weight: 800;
          letter-spacing: 0.1em;
          background:
            radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 42%),
            radial-gradient(circle at 70% 78%, rgba(8,145,178,0.55), transparent 50%),
            linear-gradient(145deg, #22d3ee 0%, #0284c7 48%, #0e7490 100%);
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.35) inset,
            0 10px 22px -8px rgba(6,182,212,0.75),
            0 0 36px -2px rgba(34,211,238,0.65);
          transition: transform 0.25s ease, box-shadow 0.25s ease;
          animation: tpSphereBreath 3.2s ease-in-out infinite;
        }
        .tp-sphere-start:hover .tp-sphere-core {
          transform: scale(1.08) rotate(-8deg);
          animation: none;
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.45) inset,
            0 14px 32px -8px rgba(6,182,212,0.95),
            0 0 56px 0 rgba(34,211,238,0.75);
        }
        .tp-sphere-label {
          font-size: 0.65rem;
          text-shadow: 0 1px 8px rgba(8,47,73,0.45);
        }
        .tp-sphere-ring {
          position: absolute;
          inset: -5px;
          border-radius: 999px;
          border: 1px solid rgba(103, 232, 249, 0.45);
          animation: tpSphereSpin 7s linear infinite;
          pointer-events: none;
        }
        .tp-sphere-ring::before {
          content: '';
          position: absolute;
          width: 5px;
          height: 5px;
          border-radius: 999px;
          background: #67e8f9;
          top: 2px;
          left: 50%;
          box-shadow: 0 0 12px #67e8f9;
        }
        .tp-sphere-ring-delay {
          inset: -10px;
          border-color: rgba(14,165,233,0.28);
          animation-duration: 11s;
          animation-direction: reverse;
        }
        .tp-sphere-ring-sm {
          inset: -3px;
          animation-duration: 9s;
        }
        .tp-sphere-section {
          width: 3.45rem;
          height: 3.45rem;
          animation: tpSphereIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .tp-sphere-core-sm {
          width: 3.45rem;
          height: 3.45rem;
          background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), transparent 40%),
            linear-gradient(145deg, color-mix(in srgb, var(--sphere-accent, #22d3ee) 82%, white), color-mix(in srgb, var(--sphere-accent, #22d3ee) 40%, #020617));
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.35) inset,
            0 8px 18px -8px color-mix(in srgb, var(--sphere-accent, #22d3ee) 70%, transparent),
            0 0 24px -4px color-mix(in srgb, var(--sphere-accent, #22d3ee) 55%, transparent);
          color: #fff;
        }
        .tp-sphere-section.is-hot .tp-sphere-core-sm {
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.45) inset,
            0 0 0 2px color-mix(in srgb, var(--sphere-accent, #22d3ee) 55%, transparent),
            0 0 28px 0 color-mix(in srgb, var(--sphere-accent, #22d3ee) 70%, transparent);
        }
        .tp-sphere-label-sm {
          font-size: 0.55rem;
          letter-spacing: 0.12em;
          font-weight: 800;
        }
        .tp-sphere-orbit {
          min-height: 8rem;
        }
        .tp-sphere-orbit-ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 3.8rem;
          height: 12rem;
          transform: translate(-50%, -50%);
          border-radius: 999px;
          border: 1px dashed rgba(103, 232, 249, 0.22);
          animation: tpSphereOrbitSpin 18s linear infinite;
          pointer-events: none;
        }
        .tp-sphere-leaf {
          border: 1px solid rgba(148, 163, 184, 0.12);
          background: rgba(255, 255, 255, 0.06);
          color: #e2e8f0;
        }
        .tp-sphere-leaf:hover:not(:disabled) {
          background: rgba(34, 211, 238, 0.12);
          border-color: rgba(34, 211, 238, 0.35);
          box-shadow: 0 0 18px -10px rgba(34, 211, 238, 0.8);
        }
        .tp-sphere-leaf.is-active {
          background: linear-gradient(90deg, rgba(6,182,212,0.28), rgba(255,255,255,0.06));
          border-color: rgba(34, 211, 238, 0.45);
        }
        .tp-sphere-leaf .tp-leaf-title {
          color: #f1f5f9;
        }
        .tp-sphere-leaf .tp-leaf-sub {
          color: rgba(148, 163, 184, 0.9);
        }
        .tp-sphere-mini {
          width: 1.85rem;
          height: 1.85rem;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), transparent 45%),
            linear-gradient(145deg, color-mix(in srgb, var(--sphere-accent, #22d3ee) 85%, white), color-mix(in srgb, var(--sphere-accent, #22d3ee) 40%, #0f172a));
          box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 0 12px -2px rgba(34,211,238,0.5);
        }
        @keyframes tpSphereSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes tpSphereIn {
          from { opacity: 0; transform: scale(0.72) translateY(8px); }
          to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes tpSphereOrbitSpin {
          from { transform: translate(-50%, -50%) rotate(0deg); }
          to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes tpSphereBreath {
          0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.35) inset, 0 10px 22px -8px rgba(6,182,212,0.75), 0 0 28px -2px rgba(34,211,238,0.45); }
          50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.4) inset, 0 12px 26px -8px rgba(6,182,212,0.9), 0 0 42px 0 rgba(34,211,238,0.7); }
        }
        .tp-workspace {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 7px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: linear-gradient(180deg, rgba(6,182,212,0.35), rgba(100,116,139,0.35));
          border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.55); }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .touch-manipulation { touch-action: manipulation; }

        /* Login atmosphere */
        .tp-login {
          min-height: 100dvh;
          background:
            radial-gradient(900px 500px at 20% 10%, rgba(6, 182, 212, 0.26), transparent 55%),
            radial-gradient(700px 400px at 90% 80%, rgba(14, 165, 233, 0.2), transparent 50%),
            radial-gradient(500px 280px at 50% 100%, rgba(8, 145, 178, 0.12), transparent 60%),
            linear-gradient(160deg, #070b14 0%, #0b1220 40%, #101a2e 100%);
          color: #e2e8f0;
        }
    </style>

</head>

      <div id="tp-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b;background:#f8fafc;">
        正在加载…
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
